testcontainers-postgresql = { group = "org.testcontainers", name = "testcontainers-postgresql", version.ref = "testcontainers" }
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
# Vico for Compose. Kotlin Multiplatform: Gradle picks its Android build.
vico-compose = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }

# Used only by the convention plugins in build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle-api", version.ref = "androidGradlePlugin" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
room-gradlePlugin = { group = "androidx.room", name = "room-gradle-plugin", version.ref = "room" }

