# Android CI (ulap-reference.md §9): formatting, static analysis, Android Lint, unit tests and a
# debug build whenever the app, the shared module or the build changes. The same command runs
# locally:
#   ./gradlew spotlessCheck detekt :androidApp:lintDebug test assembleDebug -PwarningsAsErrors=true
name: ci-android

# Every push and pull request, not only those touching the app: the `main` ruleset requires this
# check, and a check that never starts would leave a docs-only pull request waiting forever.
# The first step decides whether anything needs checking (README.md §12).
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name is the status check GitHub shows, and the one branch rules can require.
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Actions are pinned to a commit SHA; the comment names the release (ulap-reference.md §9).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its parent, for the next step's diff.
          fetch-depth: 2

      # When none of the files this job checks changed (a docs-only pull request), the steps below
      # are skipped and the check passes in seconds. `main` only takes squash merges, so the first
      # parent is the base on both events: a pull request's merge commit, or the commit on `main`.
      # A failed diff fails the step, so a broken check never passes by skipping.
      - name: Did any file this job checks change?
        id: changes
        env:
          # One regex per line, no blank lines. Keep in step with ulap-reference.md §9.
          PATHS: |-
            ^androidApp/
            ^core/
            ^feature/
            ^shared/
            ^build-logic/
            ^gradle/
            ^config/
            ^gradlew$
            ^gradlew\.bat$
            ^[^/]+\.gradle\.kts$
            ^gradle\.properties$
            ^\.editorconfig$
            ^\.github/workflows/ci-android\.yml$
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -qE -f <(printf '%s\n' "$PATHS"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No app or build files changed, so the checks were skipped."
          fi

      # The JDK Gradle runs on (gradle/gradle-daemon-jvm.properties asks for 25).
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "25"

      # Caches downloaded dependencies and build outputs between runs; read-only on pull requests.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.run == 'true'

      # `test` includes the server's Testcontainers tests; ubuntu runners have Docker.
      - name: Check, test and build
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew spotlessCheck detekt :androidApp:lintDebug test assembleDebug -PwarningsAsErrors=true

      # A changed Room entity regenerates its schema JSON during the build. If that differs from
      # the committed file, the schema wasn't committed (ulap-reference.md §5).
      - name: Room schemas are committed
        if: steps.changes.outputs.run == 'true'
        run: |
          changes=$(git status --porcelain -- core/database/schemas)
          if [ -n "$changes" ]; then
            echo "::error::Room schema files changed in the build but are not committed:"
            echo "$changes"
            exit 1
          fi

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            build/reports/
          retention-days: 7
