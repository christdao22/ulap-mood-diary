# Server CI (ulap-reference.md §9): the shared module's tests on every target, the server's tests
# against a real PostgreSQL (Testcontainers, on the runner's Docker), formatting and detekt.
# The same command runs locally (Docker must be running):
#   ./gradlew :shared:allTests :server:test spotlessCheck detekt -PwarningsAsErrors=true
name: ci-server

# Every push and pull request: the `main` ruleset requires this check, so it must always report.
# The first step decides whether anything needs checking (see ci-android.yml, README.md §12).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Skips the steps below when none of the files this job checks changed. How the diff works:
      # the same step in ci-android.yml.
      - name: Did any file this job checks change?
        id: changes
        env:
          # One regex per line, no blank lines. Keep in step with ulap-reference.md §9.
          PATHS: |-
            ^server/
            ^shared/
            ^build-logic/
            ^gradle/
            ^config/
            ^infra/
            ^gradlew$
            ^gradlew\.bat$
            ^[^/]+\.gradle\.kts$
            ^gradle\.properties$
            ^\.github/workflows/ci-server\.yml$
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -qE -f <(printf '%s\n' "$PATHS"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No server or build files changed, so the checks were skipped."
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: steps.changes.outputs.run == 'true'
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.changes.outputs.run == 'true'

      - name: Test and check
        if: steps.changes.outputs.run == 'true'
        run: ./gradlew :shared:allTests :server:test spotlessCheck detekt -PwarningsAsErrors=true

      # The image the deploy runbook pushes must still build (docs/runbooks/deploy.md).
      - name: Server image builds
        if: steps.changes.outputs.run == 'true'
        run: |
          ./gradlew :server:buildFatJar
          docker build -f server/Dockerfile -t ulap-server:ci .

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-reports
          path: |
            server/build/reports/
            shared/build/reports/
          retention-days: 7
