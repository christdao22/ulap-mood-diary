# Build settings only. No URLs, client IDs or secrets: those live in
# ~/.gradle/gradle.properties as ulap.* keys (README §8, ulap-reference.md §4.3).

org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
# Build independent modules at the same time, and reuse outputs from earlier builds.
org.gradle.parallel=true
org.gradle.caching=true
# Skip the configuration phase when no build script has changed.
org.gradle.configuration-cache=true
# Parallel Android Studio sync (Gradle 9.4+).
org.gradle.tooling.parallel=true

kotlin.code.style=official

# Treat Kotlin warnings as errors with -PwarningsAsErrors=true (CI always passes it).
